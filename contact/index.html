<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Lolikha</title>
  <meta name="description" content="Book a project with Lolikha. International clients welcome. Billed in USD via Wise. hello@lolikha.com" />
  <link rel="icon" href="../images/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Syne:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-root="../">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"><span data-progress></span></div>
  <div class="cursor" data-cursor aria-hidden="true">
    <div class="cursor-dot"></div>
  </div>

  <div class="page-shell">
    <div data-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="container" data-reveal>
          <p class="eyebrow">Contact</p>
          <h1>Higher, by design.</h1>
          <p class="lede">Tell us what you’re building. We’ll follow up on scope, timing, and next steps.</p>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="container contact-layout">
          <div data-reveal>
            <p class="lede" style="margin-top:0">
              International clients welcome. Projects billed in USD via Wise.
            </p>
            <p style="margin-top:16px">
              Prefer email?
              <a href="mailto:hello@lolikha.com" style="margin-left:6px; text-decoration:underline; text-underline-offset:3px">hello@lolikha.com</a>
            </p>
            <div class="contact-socials" aria-label="Social">
              <a href="https://www.instagram.com/lolikha_/" target="_blank" rel="noopener noreferrer">
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></svg>
                Instagram
              </a>
              <a href="https://www.facebook.com/Lolikha.co" target="_blank" rel="noopener noreferrer">
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H8v3h3v7h3v-7h3l1-3h-4V9c0-.6.4-1 1-1z" fill="currentColor"/></svg>
                Facebook
              </a>
            </div>
          </div>

          <form class="contact-form" data-contact-form data-reveal novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required placeholder="Your name" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@brand.com" />
            </div>
            <div class="field">
              <label for="project-type">Project type</label>
              <select id="project-type" name="projectType" required>
                <option value="" disabled selected>Select one</option>
                <option value="Website Design & Management">Website Design &amp; Management</option>
                <option value="Video Editing & Production">Video Editing &amp; Production</option>
                <option value="Social Media Management">Social Media Management</option>
                <option value="Business & Executive Support">Business &amp; Executive Support</option>
                <option value="Content & Design Production">Content &amp; Design Production</option>
                <option value="A mix of services">A mix of services</option>
              </select>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required placeholder="Goals, timeline, links — whatever helps."></textarea>
            </div>
            <button class="btn btn-dark btn-slide" type="submit" data-magnetic>
              <span class="btn-label"><span>Send message</span><span>Send message</span></span>
            </button>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
    <div data-footer></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="../js/partials.js"></script>
  <script src="../app.js"></script>
</body>
</html>
